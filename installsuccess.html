<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DashPoint × Discord</title>
<link rel="icon" href="assets/skins/skin-35.png" type="image/png" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    color: #fff;
    background: linear-gradient(180deg, #040810 0%, #0a1628 55%, #122a4a 100%);
    overflow: hidden;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(2px 2px at 8% 18%, #fff, transparent),
      radial-gradient(2px 2px at 24% 72%, #fff, transparent),
      radial-gradient(2px 2px at 47% 33%, #fff, transparent),
      radial-gradient(2px 2px at 63% 85%, #fff, transparent),
      radial-gradient(2px 2px at 81% 22%, #fff, transparent),
      radial-gradient(2px 2px at 93% 60%, #fff, transparent);
    opacity: 0.7;
    pointer-events: none;
  }
  .card {
    position: relative;
    text-align: center;
    padding: 40px 48px;
    max-width: min(520px, calc(100vw - 40px));
    background: rgba(14, 20, 36, 0.55);
    border: 4px solid #0a0f1e;
    box-shadow: inset 2px 2px 0 rgba(255, 255, 255, 0.1), 10px 10px 0 rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    animation: pop 0.25s ease-out;
  }
  @keyframes pop {
    from { transform: translateY(14px) scale(0.96); opacity: 0; }
    to { transform: none; opacity: 1; }
  }
  .card img {
    width: 96px;
    height: 96px;
    image-rendering: pixelated;
    filter: drop-shadow(0 0 18px rgba(88, 101, 242, 0.8));
    margin-bottom: 18px;
  }
  h1 {
    font-size: 22px;
    letter-spacing: 1px;
    line-height: 1.5;
    text-shadow: 3px 3px 0 rgba(0, 0, 0, 0.4);
  }
  h1 .go { color: #3ee07a; }
  p {
    margin-top: 12px;
    font-size: 15px;
    color: #9db4d8;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
  <div class="card">
    <img src="assets/skins/skin-35.png" alt="Discord cube" />
    <h1><span class="go">Successfully connected</span> DashPoint to your Discord account!</h1>
    <p>Head back to Discord!</p>
  </div>
</body>
</html>
