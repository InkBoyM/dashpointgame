<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DashPoint - Random Level</title>
  <script>
    (function () {
      var s = window.location.search || "";
      var h = window.location.hash || "";
      if (!s) {
        window.location.replace("/?random" + h);
      } else {
        if (s.indexOf("random") === -1 && s.indexOf("seed") === -1) {
          s += "&random";
        }
        window.location.replace("/" + s + h);
      }
    })();
  </script>
</head>
<body>
  <p>Loading random level...</p>
</body>
</html>
